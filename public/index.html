<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodBoard — Mood Diary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dark">
    <main class="app">
      <div class="header">
        <h1>MoodBoard</h1>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          ☀️
        </button>
      </div>
      <p class="subtitle">How are you feeling today?</p>

      <div class="moods">
        <button class="mood-btn" data-mood="happy">😄</button>
        <button class="mood-btn" data-mood="good">🙂</button>
        <button class="mood-btn" data-mood="neutral">😐</button>
        <button class="mood-btn" data-mood="sad">😔</button>
        <button class="mood-btn" data-mood="bad">😢</button>
      </div>

      <textarea
        id="note"
        placeholder="Want to write something about your day? (optional)"
        rows="2"
      ></textarea>

      <button id="save" class="save">Save today's entry</button>

      <div class="history-header">
        <h2 class="history-title">History</h2>
        <p id="stats" class="stats"></p>
      </div>
      <div id="history" class="history"></div>
    </main>

    <script src="moodboard.js"></script>
  </body>
</html>
